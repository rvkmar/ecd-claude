name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Installing on the Linux runner (rather than reusing a Windows/macOS
      # node_modules) is what actually resolves the native
      # @rollup/rollup-linux-x64-gnu optional-dependency mismatch that has
      # blocked verification in prior sessions.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
